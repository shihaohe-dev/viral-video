<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d11" />
  <meta name="6844d68670e4c09da5a0c0b5de0211438355ea32" content="6844d68670e4c09da5a0c0b5de0211438355ea32" />
  <title>Vid18+ - Nonton Video Gratis</title>

  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="preconnect" href="https://uyabibpagreajvwtznoy.supabase.co" crossorigin />
  <link rel="modulepreload" href="js/config.js" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="logo" href="index.html" aria-label="Vid18+ beranda">Vid<b>18+</b></a>
      <form id="search-form" class="search" role="search">
        <input type="search" id="search-input" placeholder="Cari video" autocomplete="off" aria-label="Cari video" />
        <button type="submit" aria-label="Cari">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>
    </div>
  </header>

  <main class="wrap">
    <div id="toolbar" class="toolbar">
      <div class="chips" role="group" aria-label="Kategori">
        <button type="button" class="chip is-active" data-category="all">Semua</button>
        <button type="button" class="chip" data-category="colmek">Colmek</button>
        <button type="button" class="chip" data-category="berdua">Berdua</button>
        <button type="button" class="chip" data-category="bergilir">Bergilir</button>
        <button type="button" class="chip" data-category="lainnya">Lainnya</button>
      </div>
      <div class="seg" role="group" aria-label="Urutan">
        <button type="button" class="seg-btn is-active" data-tab="recommended">Rekomendasi</button>
        <button type="button" class="seg-btn" data-tab="latest">Terbaru</button>
        <button type="button" class="seg-btn" data-tab="popular">Populer</button>
      </div>
    </div>

    <p id="result-summary" class="summary" aria-live="polite"></p>

    <section id="movies-grid" class="grid" aria-label="Daftar video">
      <div class="card skeleton" aria-hidden="true"><div class="thumb"></div><div class="skel-line"></div></div>
      <div class="card skeleton" aria-hidden="true"><div class="thumb"></div><div class="skel-line"></div></div>
      <div class="card skeleton" aria-hidden="true"><div class="thumb"></div><div class="skel-line"></div></div>
      <div class="card skeleton" aria-hidden="true"><div class="thumb"></div><div class="skel-line"></div></div>
    </section>

    <nav id="pager" class="pager" aria-label="Halaman" hidden></nav>
  </main>

  <script type="module" src="js/home.js"></script>
</body>
</html>
