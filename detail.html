<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d11" />
  <title>Detail Video - Vid18+</title>

  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="preconnect" href="https://uyabibpagreajvwtznoy.supabase.co" crossorigin />
  <link rel="modulepreload" href="/js/config.js" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="logo" href="/" aria-label="Vid18+ beranda">Vid<b>18+</b></a>
      <a class="back" href="/">‹ Semua video</a>
    </div>
  </header>

  <main class="wrap detail">
    <div id="video-container" class="video-container">
      <video id="video-player" class="video-player" controls playsinline preload="none"></video>
    </div>

    <div class="video-info">
      <h1 id="video-title" class="video-title">Memuat...</h1>
      <div class="video-meta">
        <span id="video-category" class="tag">Kategori</span>
        <span id="video-views">▶ 0 penonton</span>
      </div>
      <p id="video-description" class="video-description"></p>
    </div>

    <div class="actions">
      <button id="share-btn" type="button" class="btn">Bagikan</button>
      <button id="download-btn" type="button" class="btn btn-primary">Unduh</button>
    </div>

    <section class="related" aria-labelledby="related-title">
      <h2 id="related-title" class="section-title">Video lainnya</h2>
      <div id="related-grid" class="grid"></div>
    </section>
  </main>

  <script type="module" src="/js/detail.js"></script>
</body>
</html>
